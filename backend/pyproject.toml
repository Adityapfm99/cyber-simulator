[project]
name = "cyber-simulator-backend"
version = "0.1.0"
description = "Defensive cyber-range training platform — backend (Spektek MVP)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
